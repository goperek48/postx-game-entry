<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Star Catcher — built by an AI agent from one prompt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b1026; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #fff; }
  #wrap { position: relative; width: min(100vw, 56.25vh); aspect-ratio: 9 / 16; max-height: 100vh; }
  canvas { width: 100%; height: 100%; display: block; background: linear-gradient(#141b3d, #0b1026);
           border-radius: 12px; touch-action: none; }
  #hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center;
          font-size: 13px; color: #9fb0ff; opacity: .85; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="960"></canvas>
  <div id="hint">← → move &nbsp;·&nbsp; drag / tap &nbsp;·&nbsp; catch the stars, dodge the rocks</div>
</div>
<script>
"use strict";
// STAR CATCHER — one file, one prompt, built by an AI agent.
const c = document.getElementById("game");
const ctx = c.getContext("2d");
const W = 540, H = 960;

const state = {
  mode: "title",        // title | play | over
  score: 0, lives: 3, timeLeft: 60,
  basketX: W / 2, basketV: 0,
  items: [], spawnT: 0, elapsed: 0, last: 0,
};

function reset() {
  state.score = 0; state.lives = 3; state.timeLeft = 60;
  state.items = []; state.spawnT = 0; state.elapsed = 0;
  state.basketX = W / 2; state.mode = "play";
}

function spawn() {
  const rock = Math.random() < 0.22;
  state.items.push({
    x: 30 + Math.random() * (W - 60),
    y: -30,
    vy: 170 + Math.random() * 160 + state.elapsed * 2.2,
    r: rock ? 20 : 16,
    rock,
    spin: Math.random() * Math.PI * 2,
    vs: (Math.random() - 0.5) * 4,
  });
}

function star(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = "#ffd94a"; ctx.strokeStyle = "#ff9d00"; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
}

function rock(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = "#8a93a6"; ctx.strokeStyle = "#5b6376"; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * Math.PI * 2, rr = r * (0.8 + 0.25 * Math.sin(i * 2.7));
    ctx[i ? "lineTo" : "moveTo"](Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
}

function drawBasket() {
  const bx = state.basketX, by = H - 90;
  ctx.fillStyle = "#ff5d8f";
  ctx.beginPath();
  ctx.moveTo(bx - 70, by); ctx.lineTo(bx + 70, by);
  ctx.lineTo(bx + 55, by + 46); ctx.lineTo(bx - 55, by + 46);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ff8fb1"; ctx.fillRect(bx - 70, by - 8, 140, 10);
}

function drawHUD() {
  ctx.fillStyle = "#fff"; ctx.font = "bold 34px system-ui, sans-serif";
  ctx.textAlign = "left"; ctx.fillText("SCORE " + state.score, 24, 52);
  ctx.textAlign = "right";
  ctx.fillText("⏱ " + Math.ceil(state.timeLeft) + "s", W - 24, 52);
  ctx.textAlign = "left";
  ctx.fillText("♥".repeat(state.lives) + "♡".repeat(3 - state.lives), 24, 96);
  ctx.fillStyle = "#9fb0ff"; ctx.font = "20px system-ui, sans-serif";
  ctx.fillText("STAR CATCHER", 24, H - 24);
}

function drawTitle() {
  ctx.fillStyle = "#ffd94a"; ctx.font = "bold 64px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("⭐ STAR", W / 2, 330);
  ctx.fillText("CATCHER", W / 2, 400);
  ctx.fillStyle = "#fff"; ctx.font = "26px system-ui, sans-serif";
  ctx.fillText("Catch the stars. Dodge the rocks.", W / 2, 470);
  ctx.fillStyle = "#9fb0ff"; ctx.font = "22px system-ui, sans-serif";
  ctx.fillText("60 seconds · 3 lives · +10 per star", W / 2, 512);
  ctx.fillStyle = "#ff5d8f"; ctx.font = "bold 30px system-ui, sans-serif";
  ctx.fillText("▶ TAP TO PLAY", W / 2, 620);
  ctx.fillStyle = "#9fb0ff"; ctx.font = "20px system-ui, sans-serif";
  ctx.fillText("built by an AI agent from one prompt", W / 2, 680);
}

function drawOver() {
  ctx.fillStyle = "rgba(11,16,38,0.82)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#ffd94a"; ctx.font = "bold 56px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("TIME UP!", W / 2, 400);
  ctx.fillStyle = "#fff"; ctx.font = "bold 40px system-ui, sans-serif";
  ctx.fillText("SCORE: " + state.score, W / 2, 480);
  ctx.fillStyle = "#9fb0ff"; ctx.font = "24px system-ui, sans-serif";
  const best = Math.max(state.score, +(localStorage.getItem("sc_best") || 0));
  localStorage.setItem("sc_best", best);
  ctx.fillText("BEST: " + best, W / 2, 530);
  ctx.fillStyle = "#ff5d8f"; ctx.font = "bold 30px system-ui, sans-serif";
  ctx.fillText("↻ TAP TO PLAY AGAIN", W / 2, 620);
}

function update(dt) {
  state.elapsed += dt;
  state.timeLeft -= dt;
  if (state.timeLeft <= 0) { state.timeLeft = 0; state.mode = "over"; return; }
  state.spawnT -= dt;
  if (state.spawnT <= 0) { spawn(); state.spawnT = Math.max(0.28, 0.85 - state.elapsed * 0.006); }
  const by = H - 90;
  for (let i = state.items.length - 1; i >= 0; i--) {
    const it = state.items[i];
    it.y += it.vy * dt; it.spin += it.vs * dt;
    if (it.y > by - 6 && it.y < by + 52 && Math.abs(it.x - state.basketX) < 72) {
      if (it.rock) { state.lives--; if (state.lives <= 0) { state.mode = "over"; return; } }
      else state.score += 10;
      state.items.splice(i, 1);
    } else if (it.y > H + 40) {
      if (!it.rock) { state.lives--; if (state.lives <= 0) { state.mode = "over"; return; } }
      state.items.splice(i, 1);
    }
  }
}

function frame(t) {
  const dt = Math.min(0.05, (t - state.last) / 1000 || 0.016);
  state.last = t;
  ctx.clearRect(0, 0, W, H);
  // starfield background
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  for (let i = 0; i < 40; i++) {
    const sx = (i * 137) % W, sy = (i * 89 + t * 0.02) % H;
    ctx.fillRect(sx, sy, 2, 2);
  }
  if (state.mode === "title") { drawTitle(); star(W / 2, 210, 46, t * 0.001); }
  else if (state.mode === "over") { drawOver(); }
  else {
    update(dt);
    for (const it of state.items) it.rock ? rock(it.x, it.y, it.r, it.spin) : star(it.x, it.y, it.r, it.spin);
    drawBasket();
    drawHUD();
  }
  requestAnimationFrame(frame);
}

// controls: keyboard + pointer
const keys = {};
addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.preventDefault();
  if (state.mode !== "play" && (e.key === "Enter" || e.key === " ")) reset();
});
addEventListener("keyup", e => keys[e.key] = false);
setInterval(() => {
  if (state.mode !== "play") return;
  if (keys.ArrowLeft || keys.a) state.basketX -= 14;
  if (keys.ArrowRight || keys.d) state.basketX += 14;
  state.basketX = Math.max(75, Math.min(W - 75, state.basketX));
}, 16);
function pointer(x) {
  const r = c.getBoundingClientRect();
  state.basketX = Math.max(75, Math.min(W - 75, (x - r.left) / r.width * W));
}
c.addEventListener("pointermove", e => { if (state.mode === "play") pointer(e.clientX); });
c.addEventListener("pointerdown", e => {
  if (state.mode !== "play") reset();
  else pointer(e.clientX);
});
requestAnimationFrame(frame);
</script>
</body>
</html>
